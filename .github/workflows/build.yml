name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
    steps:
      - uses: actions/checkout@v4

      - name: Install Java (for keytool/apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked

      - name: Generate self-signed release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/player.keystore" \
            -alias player \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Player, OU=Player, O=Player, L=Unknown, ST=Unknown, C=US"

      - name: Build and sign APK
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/player.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: |
          # cpal (rodio) links -laaudio on Android but the NDK only places the
          # arm64 runtime lib under API-specific dirs; seed the linker search path
          # that cargo-apk2 already adds. Must not abort if absent.
          mkdir -p target/cargo-apk-temp-extra-link-libraries || true
          find "$ANDROID_NDK_HOME" -name libaaudio.so 2>/dev/null \
            | grep -E 'aarch64|arm64' \
            | while read -r f; do cp -f "$f" target/cargo-apk-temp-extra-link-libraries/ || true; done
          cargo apk2 build --release
          cp target/release/apk/player.apk player-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-arm64
          path: player-arm64.apk