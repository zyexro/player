name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
    steps:
      - uses: actions/checkout@v4

      - name: Install Java (for keytool/apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked

      - name: Generate self-signed release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/player.keystore" \
            -alias player \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Player, OU=Player, O=Player, L=Unknown, ST=Unknown, C=US"

      - name: Build APK
        run: cargo apk2 build --release

      - name: Sign APK
        run: |
          APK=$(ls target/release/apk/*.apk 2>/dev/null || ls target/*/apk/*.apk 2>/dev/null | head -n1)
          test -n "$APK" || { echo "no built apk found"; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/player.keystore" \
            --ks-key-alias player \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "player-arm64.apk" \
            "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-arm64
          path: player-arm64.apk